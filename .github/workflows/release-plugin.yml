name: release-plugin

# Publishes the eksinf cub CLI plugin as a GitHub release.
#
#   git tag v0.1.0 && git push origin v0.1.0
#   cub plugin install confighub/eks-inference
#
# Asset naming is a contract, not a preference: cub locates the right binary by
# <repo-name>-<goos>-<goarch>, matching the convention of the other cub plugins
# (cub-che, cub-lk). Rename these and `cub plugin install` stops finding them.
#
# This is a SEPARATE cadence from the config bundles. publish-config-bundles.yml
# runs on pushes to main and republishes a floating :latest; this runs only on a
# v* tag. A tag push does not match that workflow's `branches:` filter, so
# tagging does not republish bundles.

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - run: go vet ./...
      # Guards the embedded components.yaml: a malformed or renamed file would
      # otherwise break the shipped binary at startup rather than here.
      - run: go test ./...
      - name: gofmt
        run: |
          unformatted="$(gofmt -l . | grep -v '^configs/' || true)"
          if [[ -n "$unformatted" ]]; then
            echo "::error::not gofmt'd:"; echo "$unformatted"; exit 1
          fi

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          version="${GITHUB_REF_NAME#v}"
          ldflags="-s -w \
            -X github.com/confighub/eks-inference/cmd.version=${version} \
            -X github.com/confighub/eks-inference/cmd.commit=${GITHUB_SHA} \
            -X github.com/confighub/eks-inference/cmd.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          out="eks-inference-${GOOS}-${GOARCH}"
          go build -trimpath -ldflags "$ldflags" -o "$out" .
          echo "ASSET=$out" >> "$GITHUB_ENV"
      - name: Checksum
        run: shasum -a 256 "$ASSET" > "$ASSET.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
