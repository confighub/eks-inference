# Source: eks-chart/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ack-eks-eks-chart
  namespace: ack-system
  labels:
    app.kubernetes.io/name: eks-chart
    app.kubernetes.io/instance: ack-eks
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "1.16.3"
    k8s-app: eks-chart
    helm.sh/chart: eks-chart-1.16.3
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eks-chart
      app.kubernetes.io/instance: ack-eks
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eks-chart
        app.kubernetes.io/instance: ack-eks
        app.kubernetes.io/managed-by: Helm
        k8s-app: eks-chart
    spec:
      serviceAccountName: ack-eks-controller
      containers:
        - command:
            - ./bin/controller
          args:
            - --aws-region
            - "$(AWS_REGION)"
            - --aws-endpoint-url
            - "$(AWS_ENDPOINT_URL)"
            - --log-level
            - "$(ACK_LOG_LEVEL)"
            - --resource-tags
            - "$(ACK_RESOURCE_TAGS)"
            - --watch-namespace
            - "$(ACK_WATCH_NAMESPACE)"
            - --watch-selectors
            - "$(ACK_WATCH_SELECTORS)"
            - --reconcile-resources
            - "$(RECONCILE_RESOURCES)"
            - --deletion-policy
            - "$(DELETION_POLICY)"
            - --reconcile-default-resync-seconds
            - "$(RECONCILE_DEFAULT_RESYNC_SECONDS)"
            - --reconcile-default-max-concurrent-syncs
            - "$(RECONCILE_DEFAULT_MAX_CONCURRENT_SYNCS)"
            - --feature-gates
            - "$(FEATURE_GATES)"
            - --enable-carm=true
            - --enable-cross-namespace=true
          image: public.ecr.aws/aws-controllers-k8s/eks-controller:1.16.3
          imagePullPolicy: IfNotPresent
          name: controller
          ports:
            - name: http
              containerPort: 8080
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          env:
            - name: ACK_SYSTEM_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AWS_REGION
              value: confighubplaceholder
            - name: AWS_ENDPOINT_URL
              value: ""
            - name: AWS_IDENTITY_ENDPOINT_URL
              value: ""
            - name: ACK_WATCH_NAMESPACE
              value:
            - name: ACK_WATCH_SELECTORS
              value:
            - name: RECONCILE_RESOURCES
              value: "AccessEntry,Addon,Capability,Cluster,FargateProfile,IdentityProviderConfig,Nodegroup,PodIdentityAssociation"
            - name: DELETION_POLICY
              value: retain
            - name: LEADER_ELECTION_NAMESPACE
              value: ""
            - name: ACK_LOG_LEVEL
              value: "info"
            - name: ACK_RESOURCE_TAGS
              value: "services.k8s.aws/controller-version=%CONTROLLER_SERVICE%-%CONTROLLER_VERSION%,services.k8s.aws/namespace=%K8S_NAMESPACE%,app.kubernetes.io/managed-by=%MANAGED_BY%,kro.run/kro-version=%KRO_VERSION%"
            - name: RECONCILE_DEFAULT_RESYNC_SECONDS
              value: "36000"
            - name: RECONCILE_DEFAULT_MAX_CONCURRENT_SYNCS
              value: "1"
            - name: FEATURE_GATES
              value: IAMRoleSelector=false,ReadOnlyResources=true,ResourceAdoption=true,ServiceLevelCARM=false,TeamLevelCARM=false
            - name: AWS_SHARED_CREDENTIALS_FILE
              value: /var/run/secrets/aws/credentials
            - name: AWS_PROFILE
              value: default
          volumeMounts:
            - name: aws-creds
              mountPath: /var/run/secrets/aws
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      nodeSelector:
        kubernetes.io/os: linux
      hostIPC: false
      hostPID: false
      hostNetwork: false
      dnsPolicy: ClusterFirst
      volumes:
        - name: aws-creds
          secret:
            secretName: aws-creds
