# Cluster and node roles. Both use AWS managed policies — this stack is not
# trying to teach least-privilege IAM, and hand-rolled equivalents would drift
# from AWS's as EKS adds permissions.
apiVersion: iam.services.k8s.aws/v1alpha1
kind: Role
metadata:
  name: inference-demo-cluster-role
  namespace: aws-inference
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  name: inference-demo-cluster-role
  description: EKS control plane role for inference-demo
  assumeRolePolicyDocument: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Principal": { "Service": "eks.amazonaws.com" },
          "Action": "sts:AssumeRole"
        }
      ]
    }
  policies:
    - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
  tags:
    - key: eks-inference.confighub.com/stack
      value: inference-demo
---
apiVersion: iam.services.k8s.aws/v1alpha1
kind: Role
metadata:
  name: inference-demo-node-role
  namespace: aws-inference
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  name: inference-demo-node-role
  description: EKS worker node role for inference-demo
  assumeRolePolicyDocument: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Principal": { "Service": "ec2.amazonaws.com" },
          "Action": "sts:AssumeRole"
        }
      ]
    }
  policies:
    - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
    - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
    - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
  tags:
    - key: eks-inference.confighub.com/stack
      value: inference-demo
    # NO karpenter.sh/discovery TAG HERE, deliberately. Karpenter will reuse this
    # role for the nodes it launches, but EC2NodeClass takes spec.role as a plain
    # role *name* — there is no role selector and nothing ever reads a tag on it.
    # An earlier version tagged this role for "discovery", which did nothing.
